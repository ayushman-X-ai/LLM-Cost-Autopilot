# Model registry with real, verifiable pricing.
#
# Prices are USD per 1K tokens and were checked against provider pricing pages
# on the date given in `pricing_updated_at`. Provider pricing changes over
# time -- re-verify before publishing measured savings:
#   OpenAI:   https://developers.openai.com/api/docs/pricing
#   Anthropic: https://platform.claude.com/docs/en/models/overview
#
# Model ID lifecycle notes (checked 2026-09-22):
#   - claude-3-5-sonnet-latest retired 2025-10-28, claude-3-5-haiku-latest
#     retired 2026-02-19; replaced below with active models.
#   - gpt-4o / gpt-4o-mini remain available on the OpenAI API.
models:
  ollama_llama:
    provider: ollama
    model_id: llama3.2:3b
    input_cost_per_1k: 0.0
    output_cost_per_1k: 0.0
    average_latency_ms: 700
    quality_tier: low
    enabled: true
    pricing_updated_at: "2026-09-22"
    pricing_notes: "Local inference via Ollama; no per-token API charge (hardware cost only)."

  openai_mini:
